name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Runs unit tests, the Testcontainers integration tests (the runner
      # provides Docker), and the ArchUnit module-boundary rules.
      - name: Test
        working-directory: backend
        run: ./mvnw -B verify

      - name: Package
        working-directory: backend
        run: ./mvnw -B -DskipTests package

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      # `npm run build` typechecks before bundling, so this covers both.
      - name: Build
        working-directory: frontend
        run: npm run build

  images:
    name: Container images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      # Confirms both Dockerfiles still build; images are not published here.
      - name: Build backend image
        run: docker build -t devforge-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t devforge-frontend:ci ./frontend
