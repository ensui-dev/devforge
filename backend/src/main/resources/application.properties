spring.application.name=devforge-backend

# Database. Every value is overridable by environment variable so the same image
# runs locally and in a container without a rebuild.
spring.datasource.url=${DEVFORGE_DB_URL:jdbc:postgresql://localhost:5432/devforge}
spring.datasource.username=${DEVFORGE_DB_USERNAME:devforge}
spring.datasource.password=${DEVFORGE_DB_PASSWORD:devforge}

# JPA. Flyway owns the schema; `validate` makes the application refuse to start
# if the mappings and the migrated schema disagree, rather than failing later on
# the first write to a mismatched table.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=${PORT:8080}

# Access tokens. The default secret is a development placeholder; DEVFORGE_JWT_SECRET
# must be set to a strong random value in any deployed environment.
devforge.jwt.secret=${DEVFORGE_JWT_SECRET:dev-only-insecure-signing-key-change-me-please}
devforge.jwt.issuer=devforge
devforge.jwt.ttl=12h

# CORS. Needed only when the client is served from another origin; the Vite dev
# server proxies /api, so this is empty by default and CORS stays off.
devforge.cors.allowed-origins=${DEVFORGE_CORS_ORIGINS:}

# Expose health for container orchestration, nothing else.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# OpenAPI UI at /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
