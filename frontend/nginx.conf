server {
    listen 80;
    # `listen 80` alone binds IPv4 only. Accepting IPv6 too means anything that
    # resolves localhost to ::1 reaches nginx instead of being refused.
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Proxying /api from the same origin means the browser never makes a
    # cross-origin request, so no CORS configuration is needed in production.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Git over HTTP. Without this, `git clone` would fall through to the SPA
    # catch-all below and be answered with index.html.
    #
    # The smart-HTTP protocol is not a REST call and is proxied as a stream:
    # buffering either direction would hold a packfile in nginx until it was
    # complete, and swallow the progress and `remote:` messages the server sends
    # back while a push is being applied.
    location /git/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;
        # A push is one request the size of everything in it; a limit here would
        # reject a large repository with a 413 that mentions nothing about git.
        client_max_body_size 0;
        # Counting objects on a large repository is slow before a byte is sent.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Hashed asset filenames are immutable, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: unknown paths are application routes, not 404s. Bare
    # index.html must not be cached, or a deploy would leave stale asset
    # references behind.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
