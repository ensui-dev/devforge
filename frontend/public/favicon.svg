<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="DevForge">
  <!--
    The product's thesis at 16px: two documents and the typed edge joining them.
    Drawn as a plotted trace — the drafting-sheet language the rest of the
    interface uses — in the accent teal, on a tile that reads against both a
    light and a dark browser chrome.

    Deliberately three shapes. Anything finer disappears at favicon size.
  -->
  <rect width="32" height="32" rx="7" fill="#0e6b73"/>
  <!-- The edge, routed like a plotted trace rather than a straight line. -->
  <path d="M9 11 H16 A2.5 2.5 0 0 1 18.5 13.5 V18.5 A2.5 2.5 0 0 0 21 21 H23"
        fill="none" stroke="#f4f6f3" stroke-width="2.25"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- The two nodes it connects. -->
  <circle cx="9" cy="11" r="3.4" fill="#f4f6f3"/>
  <circle cx="23" cy="21" r="3.4" fill="#f4f6f3"/>
</svg>
